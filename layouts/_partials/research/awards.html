<div class="rj-awards">
  {{ range hugo.Data.awards }}
  {{ $award := . }}
  {{ $photo := false }}
  {{ with .image }}{{ $photo = resources.Get . }}{{ end }}
  <article class="rj-award" id="{{ .id }}">
    <div class="rj-award-copy">
      <span class="rj-award-year">{{ .year }}</span>
      <div><h3>{{ .title }}</h3><p>{{ .institution }}</p>
    {{ with $photo }}
    {{ $display := .Fit "1000x750 webp q90" }}
    <details class="rj-photo-details"><summary>Photo</summary>
    <figure class="rj-award-figure">
      <a class="rj-award-photo" href="{{ .RelPermalink }}" aria-label="View full photo: {{ $award.title }}, {{ $award.year }}" title="{{ $award.caption }}"><img src="{{ $display.RelPermalink }}" width="{{ $display.Width }}" height="{{ $display.Height }}" alt="{{ $award.image_alt }}" loading="lazy" decoding="async"></a>
      <figcaption>{{ $award.caption }}</figcaption>
    </figure>
    </details>
    {{ end }}
      </div>
    </div>
  </article>
  {{ end }}
</div>
