<div class="rj-areas">
  {{ range hugo.Data.research }}
  {{ $area := . }}
  <article class="rj-area">
    <a class="rj-area-image" href="{{ printf "/research/%s/" .slug | relURL }}" tabindex="-1" aria-hidden="true">
      {{ with resources.Get .image }}{{ $image := .Fit "1100x850 webp q90" }}
      <img src="{{ $image.RelPermalink }}" width="{{ $image.Width }}" height="{{ $image.Height }}" alt="" loading="lazy" decoding="async">
      {{ end }}
    </a>
    <div class="rj-area-copy">
      <h3><a href="{{ printf "/research/%s/" .slug | relURL }}">{{ .title }}</a></h3>
      <p>{{ .description }}</p>
      <a class="rj-text-link" href="{{ printf "/research/%s/" .slug | relURL }}">Explore this direction <span aria-hidden="true">&rarr;</span></a>
    </div>
  </article>
  {{ end }}
</div>
