bio: |
  I am a PhD student in Electrical and Electronic Engineering at Nanyang
  Technological University (NTU), working with Prof. Sunwoo Lee in the Lee Group.
  My research focuses on microelectronics, low-power integrated circuits, and
  optoelectronic microsystems for neural recording.

  I received my B.S. in Electronic Information Science and Technology from the
  University of Electronic Science and Technology of China (UESTC) in 2021, and
  a joint M.S. in Integrated Circuit Design from the Technical University of
  Munich (TUM) and NTU in 2023.

