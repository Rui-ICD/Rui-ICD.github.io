sections:
  neural-microsystems/architecture:
    title: 在 CMOS 中收集光能
    text: 正向偏置的 CMOS 结收集光能，为放大器和编码器供电；AlGaAs 光伏发光二极管（PVLED）则为光发射电路供电。光照增强时，额外的光电流主要流向放大器，使其带宽随之扩大；其他电路模块通过 PTAT 偏置保持相对稳定。
    figure:
      alt: FB-MOTE 的光能采集、放大、编码和光发射信号链，以及对应的供电域
      caption: 信号链与供电域。Jiao 等，IEEE TBioCAS（2026），图 3。
  neural-microsystems/silicon:
    title: 从电路到芯片
    text: 每个记录单元采用 180 nm CMOS 工艺，在 43 × 269 µm 的面积内集成放大、偏置、编码和光驱动电路。3 × 26 测试阵列用于电学与光学表征；放大的引脚图和版图展示了单个记录单元及其电路模块。
    figure:
      alt: 含 3 × 26 个 FB-MOTE 单元的测试芯片，以及放大的单元引脚图和电路版图
      caption: CMOS 测试芯片、记录单元引脚图与电路版图。Jiao 等，IEEE TBioCAS（2026），图 19。
  neural-microsystems/measurements:
    title: 测量电路如何适应光照
    text: 探针测试用于观察不同光照下的增益、带宽、时序、供电电压与噪声。随着可用光功率增加，带宽上升，而输入等效积分噪声保持近似稳定。生物实验采用引线键合芯片和外置铂电极，在生理盐水及蚯蚓急性神经实验中验证记录能力。
    figure:
      alt: 不同光照强度下实测的增益、带宽、脉冲时序、供电电压和输入等效噪声
      caption: 基于探针的光学表征。Jiao 等，IEEE TBioCAS（2026），图 12。
  optical-readout/system:
    title: 光学供能与信号传输
    text: AlGaAs 二极管兼具光伏供能与光信号回传的功能。CMOS 电路放大神经电压，以脉冲位置调制进行编码，再驱动光脉冲输出。器件通过外部照明和光检测建立供能与通信链路。
    figure:
      alt: 玻璃微管内的 MOTE 器件，与蚂蚁头部对比展示尺寸
      caption: 玻璃微管中的 MOTE，旁边以蚂蚁作尺寸参照。照片由 Rui Jiao 提供，网页显示时做了明暗调整。
  optical-readout/integration:
    title: 器件连接与防护
    text: PVLED 转移到 CMOS 芯片后，通过铂接触实现电连接。退火、封装和遮光结构帮助器件在生物环境中工作；经过减薄与释放，得到独立的植入微芯片，并保留用于记录的裸露铂电极。
    figure:
      alt: MOTE 的 PVLED 转移、接触、封装、减薄、遮光与器件释放流程
      caption: MOTE 制备与集成流程。共同作者提供的研究图，相关工作发表于 Lee 等，Nature Electronics（2025）。
  optical-readout/recordings:
    title: 长期记录验证
    text: 研究在清醒、头部固定的小鼠中记录了胡须刺激诱发的动作电位，下图展示了第 13 天和第 102 天的结果。第 365 天的测量则通过多次试验平均，恢复了较弱的局部场电位。这些是长期研究中不同类型的记录结果。
    figure:
      alt: 清醒小鼠的实验装置、植入成像，以及第 13 天和第 102 天的动作电位波形与统计
      caption: 记录装置、植入成像及第 13 天和第 102 天的动作电位结果。共同作者提供的研究图，相关工作发表于 Lee 等，Nature Electronics（2025）。
